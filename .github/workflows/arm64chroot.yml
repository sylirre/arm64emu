name: arm64chroot

# Build and run the full differential test suite whenever something arm64chroot
# is built from changes — its own sources and tests, the AArch64 emulation it
# shares with arm64emu (lib/arm64), or the build itself. A push to a branch
# that also has an open PR fires BOTH a `push` and a `pull_request` event — the
# concurrency group below collapses those two (and any superseded run) into a
# single run per branch, so the suite never executes twice for the same ref.
on:
  push:
    paths:
      - 'src/arm64chroot/**'
      - 'lib/arm64/**'
      - 'tests/arm64chroot/**'
      - 'Makefile'
      - '.github/workflows/arm64chroot.yml'
  pull_request:
    paths:
      - 'src/arm64chroot/**'
      - 'lib/arm64/**'
      - 'tests/arm64chroot/**'
      - 'Makefile'
      - '.github/workflows/arm64chroot.yml'
  workflow_dispatch:

# Same group for the push and the pull_request of a given branch:
#   push       -> head_ref is empty, so ref_name ("my-branch") is used
#   pull_request -> head_ref is the source branch ("my-branch")
# cancel-in-progress then leaves exactly one live run per branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build + test (x86_64 host)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      # gcc-aarch64-linux-gnu   -> aarch64-linux-gnu-gcc (the suite's $AGCC)
      # libc6-dev-arm64-cross   -> /usr/aarch64-linux-gnu glibc: static+dynamic
      #                            linking, and the offline source setup_env.sh
      #                            copies the glibc test rootfs from
      # qemu-user               -> qemu-aarch64: the differential oracle, and
      #                            proot's interpreter for the Alpine rootfs
      #                            (Ubuntu 26.04 has no qemu-user-static package;
      #                            the harness falls back to qemu-aarch64)
      # qemu-user-binfmt        -> the binfmt_misc handler through which the
      #                            host kernel runs a guest's execve of an
      #                            AArch64 binary under the qemu oracle (what
      #                            qemu-user-static used to register); only a
      #                            Recommends of qemu-user, so named here
      # proot                   -> Alpine minirootfs bootstrap + shell-test oracle
      # expect                  -> interactive job-control (PTY) test
      - name: Install cross toolchain, qemu oracle and rootfs bootstrap tools
        run: |
          # Enable i386 before the update so the i386 package index is fetched;
          # the -m32 test-arm64chroot32 build needs the i386 kernel headers (see next step).
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            qemu-user qemu-user-binfmt proot expect

      # 32-bit (-m32) multilib bits for the ILP32-host build exercised by
      # `make test-arm64chroot32`. The gcc-multilib metapackage can't be used here: it
      # Conflicts with every versioned cross gcc (incl. gcc-*-aarch64-linux-gnu
      # installed above), so apt reports "held broken packages". Install the
      # underlying 32-bit dev packages directly instead — they carry no such
      # conflict and coexist with the cross toolchain. All three are needed
      # because -m32 uses the i386 include/library search paths, not the
      # amd64 ones the native build already has:
      #   libc6-dev-i386     -> 32-bit libc headers (bits/libc-header-start.h)
      #                         + crt1/crti/crtn and the 32-bit libc
      #   linux-libc-dev:i386 -> 32-bit kernel headers (asm/unistd.h, pulled in
      #                         via <sys/syscall.h>); co-installs with the amd64
      #                         one (linux-libc-dev is Multi-Arch: same)
      #   lib32gcc-<v>-dev   -> 32-bit crtbegin/crtend + libgcc.a for the host
      #                         gcc; version-matched to the runner's default gcc
      #                         so a future ubuntu-latest gcc bump keeps working
      - name: Install 32-bit multilib libraries (for make test-arm64chroot32)
        run: |
          gccv=$(gcc -dumpversion | cut -d. -f1)
          sudo apt-get install -y --no-install-recommends \
            libc6-dev-i386 linux-libc-dev:i386 "lib32gcc-${gccv}-dev"

      - name: Build
        run: make arm64chroot

      # run_tests.sh auto-provisions the Alpine + glibc test rootfs from scratch
      # into build/cache/arm64chroot (one-time Alpine fetch from the CDN); no
      # hand-staged $HOME rootfs is required.
      - name: Interpreter (64-bit host)
        run: make test-arm64chroot

      - name: Interpreter (64-bit, Android seccomp)
        run: make test-arm64chroot-seccomp

      - name: Interpreter (32-bit host)
        run: make test-arm64chroot32

      - name: JIT (64-bit host)
        run: make test-arm64chroot-jit

      # The i686 code generator is compiled in by host #ifdef, so this job is
      # the only thing anywhere that EXECUTES backend_x86_32.c: the AArch64
      # runner's 32-bit build is armhf, whose CPU cannot run AArch32 at EL0.
      - name: JIT (32-bit host)
        run: make test-arm64chroot32-jit

  # The same suite on a real AArch64 machine, which is a different test in two
  # ways that the x86 job cannot cover however long it runs:
  #   - the JIT's AArch64 backend is compiled in by host #ifdef, so `make
  #     test-arm64chroot-jit` here is the only thing that ever EXECUTES
  #     backend_a64.c;
  #   - the guest binaries run on the CPU rather than under qemu, so the oracle
  #     is hardware. Deliberately no qemu-user is installed: that leaves
  #     tests/arm64chroot/hostenv.sh selecting native execution, and the suite is then
  #     checking the emulator against silicon instead of against a second
  #     emulator. (Tests that need an optional extension the runner's CPU
  #     lacks announce it and skip — see the REQUIRES: markers.)
  # No cross toolchain either: on this host the plain system cc already
  # targets the guest.
  build-test-arm64:
    name: build + test (aarch64 host)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # proot   -> Alpine minirootfs bootstrap + the shell-test oracle. Needs
      #            no qemu here: proot runs the rootfs binaries natively.
      # expect  -> interactive job-control (PTY) test
      - name: Install rootfs bootstrap tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends proot expect

      - name: Build
        run: make arm64chroot

      - name: Interpreter (aarch64 host, native oracle)
        run: make test-arm64chroot

      - name: Interpreter (aarch64 host, Android seccomp)
        run: make test-arm64chroot-seccomp

      # Reports SKIP: AArch32 at EL0 does not exist on server-class ARM cores,
      # so the 32-bit-host variant cannot be run here however it is built.
      - name: Interpreter (32-bit host)
        run: make test-arm64chroot32

      # The one job in which the AArch64 backend actually runs.
      - name: JIT (aarch64 host)
        run: make test-arm64chroot-jit

  # The same suite built with clang, because the compiler is part of what is
  # under test here. The FP core reads the host's exception flags to build the
  # guest's FPSR, and how much of that survives optimization is a compiler
  # decision C does not constrain: clang speculates FP ops out of their guards
  # and compares NaNs quietly where gcc does neither. Every Termux build is a
  # clang build, so "gcc is green" was never the same statement as "Android is
  # green" — and for three FPSR bugs it wasn't. Cheap to keep honest: one job.
  build-test-clang:
    name: build + test (clang)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install cross toolchain, qemu oracle and rootfs bootstrap tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            qemu-user qemu-user-binfmt proot expect

      - name: Build with clang
        run: make CC=clang arm64chroot

      - name: Interpreter (clang build)
        run: make CC=clang test-arm64chroot

      - name: JIT (clang build)
        run: make CC=clang test-arm64chroot-jit
