# Build chroot-ng and run its test suite whenever something it is built or
# tested from changes, on a GitHub-hosted Linux AArch64 runner.
#
# Why AArch64 and not the usual x86_64 box: the binary is an AArch64 program and
# so is every guest the suite builds. On x86_64 both would run under qemu-user,
# which does not apply a guest's seccomp filter, so the in-process SIGSYS tier
# -- the one a device actually uses -- would be inert and only -R svc-rewriting
# would be exercised (see docs/chroot-ng/testing.md). Native AArch64 makes it
# live.
#
# tests/chroot-ng/lib.sh resolves everything host-dependent (no emulator,
# native gcc as the guest toolchain, static-PIE guests) and prints what it found
# at the top of the log. It provisions the guest userland too: the Alpine and
# Debian images are fetched into build/cache/chroot-ng/rootfs on first use
# (pinned by hash in tests/chroot-ng/lib.sh), and only their tarballs are cached
# between runs here. `make test-chroot-ng` builds arm64chroot first, the oracle
# the differential legs (M10 and friends) compare against — which is why
# arm64chroot's sources are in the trigger paths below.

name: chroot-ng

on:
  push:
    paths:
      - 'src/chroot-ng/**'
      - 'tests/chroot-ng/**'
      - 'src/arm64chroot/**'
      - 'lib/arm64/**'
      - 'Makefile'
      - '.github/workflows/chroot-ng.yml'
  pull_request:
    paths:
      - 'src/chroot-ng/**'
      - 'tests/chroot-ng/**'
      - 'src/arm64chroot/**'
      - 'lib/arm64/**'
      - 'Makefile'
      - '.github/workflows/chroot-ng.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes a run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test (native AArch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    # Warnings are defects here (see src/chroot-ng/AGENTS.md), so they fail the
    # build. Job-wide, so every step builds with the same flags: a different
    # CHROOTNG_CFLAGS would rebuild chroot-ng before the suite ran it.
    env:
      CHROOTNG_CFLAGS: -Werror

    steps:
      - uses: actions/checkout@v7

      # The image ships gcc 12/13/14, make and curl; the Makefile picks the
      # native `cc` when no aarch64-linux-gnu- cross toolchain is present, and
      # tests/chroot-ng/lib.sh probes the same compiler for guests. Nothing to
      # install.
      - name: Toolchain
        run: |
          cc --version
          make --version
          uname -srm

      # The tarballs `make test-chroot-ng` provisions its rootfs images from. Only they
      # are cached: every run unpacks a fresh tree, since one restored from a
      # cache would have to be trusted to keep every mode bit and symlink
      # intact. tests/chroot-ng/lib.sh holds the pins, so editing it renews the
      # cache.
      - name: Restore rootfs tarballs
        uses: actions/cache@v6
        with:
          path: build/cache/chroot-ng/rootfs/downloads
          key: rootfs-downloads-${{ hashFiles('tests/chroot-ng/lib.sh') }}

      - name: Build
        run: make -j"$(nproc)" chroot-ng

      # The capability probe on the runner's kernel. Its exit status is 1 when a
      # hard prerequisite of the in-process design fails, so a runner image that
      # regresses shows up here by name rather than as a wall of test failures.
      - name: Probe host capabilities
        run: make probe-chroot-ng

      - name: Test
        run: make test-chroot-ng
